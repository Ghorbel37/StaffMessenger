<table class="table table-striped">
    <thead>
        <tr>
            <th>Sender</th>
            <th>Message</th>
            <th>Date</th>
            <th>
                <button (click)="clearMessages()" class="btn btn-danger" style="margin-left: 10px">Clear</button>
            </th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let message of messages ">
            <td>{{message.senderId}}</td>
            <td>{{message.messageBody}}</td>
            <td>{{message.dateSent| date:'dd/MM/yyyy - HH:mm'}} --- {{message.dateSent| dfnsFormatDistanceToNowStrict}} --- {{this.date|dfnsFormatDistanceToNow}}</td>
            <!--date:'dd/MM/yyyy - HH:mm'-->
            <td></td>
        </tr>
    </tbody>
</table>
<form (ngSubmit)="onSubmit()">
    <div class="form-group">
        <label>Message:</label>
        <input type="text" required class="form-control" id="message" [(ngModel)]="message.messageBody" name="message">
    </div>
    <br>
    <button type="submit" class="btn btn-success">Send</button>
</form>
